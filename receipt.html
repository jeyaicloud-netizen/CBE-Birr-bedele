<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>CBEBirr - Receipt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      padding-bottom: 40px;
    }

    /* Top Action Bar (Google Chrome PDF Viewer style) */
    .top-bar {
      width: 100%;
      max-width: 480px;
      background: #202124;
      color: #ffffff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-name {
      font-size: 12px;
      color: #bdc1c6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    /* Page Container representing step7_receipt_page.png */
    .page-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      line-height: 1;
    }

    /* Original Background Image */
    .receipt-bg-img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Dynamic Value Overlay Boxes */
    .overlay-field {
      position: absolute;
      background-color: #ffffff;
      border: none;
      color: #000000;
      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
      display: flex;
      align-items: center;
      padding: 0 1px;
      z-index: 10;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <!-- Chrome Action Bar -->
  <div class="top-bar">
    <a href="cbe_birr_chat.html" class="back-btn">← Back to SMS</a>
    <span class="file-name" id="receipt-doc-name">CBEBirr_Receipt.pdf</span>
  </div>

  <!-- Main Image Stage with Dynamic Red-Border Overlays -->
  <div class="page-wrapper" id="page-wrapper">
    <!-- Step 7 Base Image containing original logo, stamp, QR code, and static layout -->
    <img src="step7_receipt_page.png" alt="CBEBirr Receipt" class="receipt-bg-img" id="receipt-img">

    <!-- 1. Customer Name (Top Right) -->
    <!-- Original text: JUREYJ ABDULMENAL HUSSEN -->
    <div class="overlay-field" id="field-customer-name" style="top: 27.6%; left: 70.8%; width: 27.5%; height: 2.2%; font-size: 8.5px; font-weight: 400;">
      JUREYJ ABDULMENAL HUSSEN
    </div>

    <!-- 2. Debit Account (Phone + Name) -->
    <!-- Original text: 251959842829 - JUREYJ ABDULMENAL HUSSEN -->
    <div class="overlay-field" id="field-debit-acc" style="top: 43.4%; left: 66.0%; width: 32.5%; height: 2.5%; font-size: 8.5px; font-weight: 400;">
      251959842829 - JUREYJ ABDULMENAL HUSSEN
    </div>

    <!-- 3. Credit Account (Masked Account) -->
    <!-- Original text: 1000****6143 - CBE -->
    <div class="overlay-field" id="field-credit-acc" style="top: 45.4%; left: 66.0%; width: 32.5%; height: 1.6%; font-size: 8.5px; font-weight: 400;">
      1000****6143 - CBE
    </div>

    <!-- 4. Receiver Name -->
    <!-- Original text: Mr Gizealew Walle Demssie -->
    <div class="overlay-field" id="field-receiver-name" style="top: 46.8%; left: 66.0%; width: 32.5%; height: 1.6%; font-size: 8.5px; font-weight: 400;">
      Mr Gizealew Walle Demssie
    </div>

    <!-- 5. Order ID (FT ID) -->
    <!-- Original text: FT262413JRB4 -->
    <div class="overlay-field" id="field-order-id" style="top: 48.2%; left: 66.0%; width: 32.5%; height: 1.6%; font-size: 8.5px; font-weight: 400;">
      FT262413JRB4
    </div>

    <!-- 6. Receipt Number (TXN ID in table) -->
    <!-- Original text: DHT61MOJTU6 -->
    <div class="overlay-field" id="field-receipt-no" style="top: 56.7%; left: 6.0%; width: 30.0%; height: 1.8%; font-size: 9px; font-weight: 400;">
      DHT61MOJTU6
    </div>

    <!-- 7. Transaction Date (in table) -->
    <!-- Original text: 2026-08-29 13:29 -->
    <div class="overlay-field" id="field-txn-date" style="top: 56.7%; left: 45.0%; width: 24.0%; height: 1.8%; font-size: 9px; font-weight: 400; justify-content: center;">
      2026-08-29 13:29
    </div>

    <!-- 8. Amount (Top row in table) -->
    <!-- Original text: 240.00 -->
    <div class="overlay-field" id="field-table-amount" style="top: 56.7%; left: 81.5%; width: 12.0%; height: 1.8%; font-size: 9px; font-weight: 400; justify-content: flex-end;">
      240.00
    </div>

    <!-- 9. Paid amount (Calculation breakdown) -->
    <!-- Original text: 240.00 -->
    <div class="overlay-field" id="field-paid-amount" style="top: 58.7%; left: 81.5%; width: 12.0%; height: 1.6%; font-size: 9px; font-weight: 400; justify-content: flex-end;">
      240.00
    </div>

    <!-- 10. Total Paid Amount (Calculation bottom) -->
    <!-- Original text: 240.00 -->
    <div class="overlay-field" id="field-total-paid-amount" style="top: 64.7%; left: 81.5%; width: 12.0%; height: 1.6%; font-size: 9px; font-weight: 400; justify-content: flex-end;">
      240.00
    </div>

    <!-- 11. Total Amount in word -->
    <!-- Original text: Two Hundred and Forty ETB and zero Cents . -->
    <div class="overlay-field" id="field-amount-words" style="top: 66.0%; left: 29.5%; width: 34.0%; height: 1.6%; font-size: 8.5px; font-weight: 400;">
      Two Hundred and Forty ETB and zero Cents .
    </div>
  </div>

  <script src="src/storage.js"></script>
  <script>
    // 1. Number to English Words Converter
    function numberToWords(num) {
      if (isNaN(num)) return "Zero ETB and zero Cents .";
      const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

      function convertGroup(n) {
        let str = '';
        if (n >= 100) {
          str += a[Math.floor(n / 100)] + ' Hundred ';
          n %= 100;
          if (n > 0) str += 'and ';
        }
        if (n >= 20) {
          str += b[Math.floor(n / 10)] + ' ';
          n %= 10;
        }
        if (n > 0) {
          str += a[n] + ' ';
        }
        return str.trim();
      }

      const parts = parseFloat(num).toFixed(2).split('.');
      let intVal = parseInt(parts[0], 10);
      let decVal = parseInt(parts[1], 10);

      if (intVal === 0) {
        return `Zero ETB and ${decVal === 0 ? 'zero' : convertGroup(decVal)} Cents .`;
      }

      let words = '';
      if (intVal >= 1000000) {
        words += convertGroup(Math.floor(intVal / 1000000)) + ' Million ';
        intVal %= 1000000;
      }
      if (intVal >= 1000) {
        words += convertGroup(Math.floor(intVal / 1000)) + ' Thousand ';
        intVal %= 1000;
      }
      if (intVal > 0) {
        words += convertGroup(intVal) + ' ';
      }

      const centWord = (decVal === 0) ? 'zero' : convertGroup(decVal);
      return `${words.trim()} ETB and  ${centWord} Cents .`;
    }

    // 2. Format Masked CBE Account
    function formatMaskedAccount(rawAcc) {
      if (!rawAcc) return '1000****6143 - CBE';
      let accStr = String(rawAcc).replace(/\D/g, '');
      if (accStr.length >= 8) {
        const first4 = accStr.substring(0, 4);
        const last4 = accStr.substring(accStr.length - 4);
        return `${first4}****${last4} - CBE`;
      }
      return `${rawAcc} - CBE`;
    }

    // 3. Format Date/Time to "YYYY-MM-DD HH:MM"
    function formatReceiptDateTime(raw) {
      if (!raw) return '2026-08-29 13:29';
      const str = String(raw).trim();

      const dmyMatch = str.match(/(\d{2})[\/\-](\d{2})[\/\-](\d{4})\s+(\d{2}):(\d{2})/);
      if (dmyMatch) {
        const day = dmyMatch[1];
        const month = dmyMatch[2];
        const year = dmyMatch[3];
        const hr = dmyMatch[4];
        const min = dmyMatch[5];
        return `${year}-${month}-${day} ${hr}:${min}`;
      }

      const ymdMatch = str.match(/(\d{4})[\/\-](\d{2})[\/\-](\d{2})\s+(\d{2}):(\d{2})/);
      if (ymdMatch) {
        return `${ymdMatch[1]}-${ymdMatch[2]}-${ymdMatch[3]} ${ymdMatch[4]}:${ymdMatch[5]}`;
      }

      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      return str;
    }

    // 4. Main SMS Parser & Dynamic Overlay Population
    function parseAndPopulateReceipt() {
      const urlParams = new URLSearchParams(window.location.search);
      
      let txn = null;
      try {
        const raw = localStorage.getItem('cbe_current_receipt_txn');
        if (raw) txn = JSON.parse(raw);
      } catch(e) {}

      const rawSms = (txn && txn.rawSms) || localStorage.getItem('cbe_current_sms_text') || "";

      let amount = "240.00";
      let accountNum = "1000274326143";
      let receiverName = "Mr Gizealew Walle Demssie";
      let dateTime = "2026-08-29 13:29";
      let receiptNo = "DHT61MOJTU6";
      let orderId = "FT262413JRB4";
      let phoneNumber = "251959842829";
      let customerName = "JUREYJ ABDULMENAL HUSSEN";

      if (rawSms) {
        const amtMatch = rawSms.match(/transferred\s+([0-9,.]+)\s*Br\./i);
        if (amtMatch) amount = amtMatch[1].replace(/,/g, '');

        const accMatch = rawSms.match(/to\s+([0-9]+)\s*-/i) || rawSms.match(/to\s+<[^>]*>([0-9]+)<\/[^>]*>/i);
        if (accMatch) accountNum = accMatch[1];

        const recMatch = rawSms.match(/-\s*(Mr\s+[A-Za-z\s]+?)\s+on/i) || rawSms.match(/-(Mr[^\.]+?)on/i);
        if (recMatch) {
          receiverName = recMatch[1].trim();
        } else {
          const simpleName = rawSms.match(/to\s+[0-9\-]+\s*([A-Za-z\s]+?)\s+on/i);
          if (simpleName) receiverName = "Mr " + simpleName[1].trim();
        }

        const dateMatch = rawSms.match(/on\s+([0-9]{2}-[0-9]{2}-[0-9]{4}\s+[0-9:]+)/i) || rawSms.match(/on\s+<[^>]*>([0-9]{2}-[0-9]{2}-[0-9]{4}\s+[0-9:]+)<\/[^>]*>/i);
        if (dateMatch) dateTime = dateMatch[1];

        const txnMatch = rawSms.match(/Txn\s*ID\s*([A-Z0-9]+)\s*,\s*([A-Z0-9]+)/i);
        if (txnMatch) {
          receiptNo = txnMatch[1];
          orderId = txnMatch[2];
        } else {
          const singleTxn = rawSms.match(/Txn\s*ID\s*([A-Z0-9]+)/i);
          if (singleTxn) receiptNo = singleTxn[1];
        }

        const phMatch = rawSms.match(/PH=\+?([0-9]+)/i);
        if (phMatch) phoneNumber = phMatch[1];
      }

      if (urlParams.get('amount') || (txn && txn.amount)) {
        amount = urlParams.get('amount') || txn.amount;
      }
      if (urlParams.get('recipientAcc') || (txn && (txn.recipientAcc || txn.recipientAccount))) {
        accountNum = urlParams.get('recipientAcc') || txn.recipientAcc || txn.recipientAccount;
      }
      if (urlParams.get('recipientName') || (txn && txn.recipientName)) {
        const n = urlParams.get('recipientName') || txn.recipientName;
        receiverName = /^Mr/i.test(n) ? n : ("Mr " + n);
      }
      if (urlParams.get('dateTime') || (txn && (txn.dateTime || txn.date))) {
        dateTime = urlParams.get('dateTime') || txn.dateTime || txn.date;
      }
      if (urlParams.get('id') || (txn && (txn.id || txn.txnId))) {
        const fullId = urlParams.get('id') || txn.id || txn.txnId;
        if (fullId.includes(',')) {
          const parts = fullId.split(',');
          receiptNo = parts[0].trim();
          orderId = parts[1].trim();
        } else {
          receiptNo = fullId.trim();
        }
      }
      if (txn && txn.phone) {
        phoneNumber = String(txn.phone).replace(/^\+/, '');
      }
      if (txn && txn.userName) {
        customerName = txn.userName.toUpperCase();
        if (!customerName.includes(' ')) customerName += ' ABDULMENAL HUSSEN';
      }

      const parsedAmount = parseFloat(amount) || 240.0;
      const formattedAmount = parsedAmount.toFixed(2);
      const formattedDate = formatReceiptDateTime(dateTime);
      const formattedCreditAcc = formatMaskedAccount(accountNum);
      const debitAccText = `${phoneNumber} - ${customerName}`;
      const amountInWordsText = numberToWords(parsedAmount);

      document.getElementById('receipt-doc-name').textContent = `CBEBirr_Receipt_${receiptNo}.pdf`;
      document.getElementById('field-customer-name').textContent = customerName;
      document.getElementById('field-debit-acc').textContent = debitAccText;
      document.getElementById('field-credit-acc').textContent = formattedCreditAcc;
      document.getElementById('field-receiver-name').textContent = receiverName;
      document.getElementById('field-order-id').textContent = orderId;
      document.getElementById('field-receipt-no').textContent = receiptNo;
      document.getElementById('field-txn-date').textContent = formattedDate;
      document.getElementById('field-table-amount').textContent = formattedAmount;
      document.getElementById('field-paid-amount').textContent = formattedAmount;
      document.getElementById('field-total-paid-amount').textContent = formattedAmount;
      document.getElementById('field-amount-words').textContent = amountInWordsText;
    }

    window.addEventListener('DOMContentLoaded', parseAndPopulateReceipt);
  </script>
</body>
</html>
