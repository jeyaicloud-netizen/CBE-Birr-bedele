<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Others / ሌሎች</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; font-family: sans-serif; }
    #others-header { background: #6b1d7f; color: white; padding: 20px; text-align: center; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
    .lang-btn { cursor: pointer; background: transparent; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 5px; }
    
    #others-body { position: relative; width: 100%; flex-grow: 1; overflow-y: auto; }
    #image-wrapper { position: relative; width: 100%; display: inline-block; }
    #others-content-img { width: 100%; height: auto; display: block; }
    
    .click-overlay { position: absolute; background: transparent; z-index: 20; cursor: pointer; border: none; outline: none; }
    
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; background: white; padding: 20px; border-radius: 10px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .modal.active { display: block; }
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    .modal-overlay.active { display: block; }
    
    .form-group { padding: 10px; }
    input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
    .save-btn { padding: 10px 20px; background: #6b1d7f; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .acc-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .acc-actions { display: flex; gap: 10px; }
    .action-btn { cursor: pointer; border: none; background: none; font-size: 18px; }
  </style>
</head>
<body>
  <div id="others-header">
    <div onclick="goBack()" style="cursor: pointer; font-size: 20px;">←</div>
    <span>Others / ሌሎች</span>
    <button class="lang-btn" onclick="toggleLanguage()">EN/AM</button>
  </div>
  
  <div id="others-body">
    <div id="image-wrapper">
        <img id="others-content-img" src="./btn_others_en.png" alt="Others Content">
        
        <!-- Click Overlays -->
        <div id="all-accounts-overlay" class="click-overlay" style="top: 24.5%; left: 0; width: 100%; height: 5.5%;" onclick="window.location.href='all_accounts.html'"></div>
        <div id="biometrics-overlay" class="click-overlay" style="top: 44.5%; left: 0; width: 100%; height: 5.5%;"></div>
        <!-- Exchange Rate / የውጭ ምንዛሬ (Long press or tap to choose 127 vs 847) -->
        <div id="exchange-rate-overlay" class="click-overlay" style="top: 54.2%; left: 0; width: 100%; height: 5.5%; cursor: pointer;" title="USSD Mode (*127* / *847*)"></div>
        <div id="chatbot-overlay" class="click-overlay" style="top: 64.5%; left: 0; width: 100%; height: 5.5%;"></div>
        <div id="sms-overlay" class="click-overlay" style="top: 84.5%; left: 0; width: 100%; height: 5.5%;"></div>
        <div class="click-overlay" style="bottom: 0; left: 0; width: 25%; height: 8%;" onclick="goHome()"></div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModals()"></div>

  <!-- USSD Mode Selection Modal (733 vs 847 vs 127) -->
  <div class="modal" id="ussd-mode-modal" style="text-align: center; max-width: 330px; border-radius: 14px; padding: 22px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.25);">
    <h3 style="margin: 0 0 6px 0; color: #6b1d7f; font-size: 20px;">የ USSD መደወያ ምርጫ</h3>
    <p style="margin: 0 0 16px 0; color: #666; font-size: 13px;">አካውንት ሲፈለግ የሚደወለው የ USSD ኮድ</p>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 5px 0 15px 0;">
      <button id="btn-mode-733" onclick="selectUssdMode('733')" style="padding: 14px 12px; font-size: 15px; font-weight: bold; border-radius: 10px; border: 2px solid #6b1d7f; background: #6b1d7f; color: #fff; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;">
        <span>733 (*733*3*1*1*...*5#)</span>
        <span id="check-mode-733" style="display: inline-block; font-size: 18px;">✓</span>
      </button>
      <button id="btn-mode-847" onclick="selectUssdMode('847')" style="padding: 14px 12px; font-size: 15px; font-weight: bold; border-radius: 10px; border: 2px solid #6b1d7f; background: #fff; color: #6b1d7f; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;">
        <span>847 (*847*1*2*...#)</span>
        <span id="check-mode-847" style="display: none; font-size: 18px;">✓</span>
      </button>
      <button id="btn-mode-127" onclick="selectUssdMode('127')" style="padding: 14px 12px; font-size: 15px; font-weight: bold; border-radius: 10px; border: 2px solid #6b1d7f; background: #fff; color: #6b1d7f; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;">
        <span>127 (*127*2*2*99*99*9*...#)</span>
        <span id="check-mode-127" style="display: none; font-size: 18px;">✓</span>
      </button>
    </div>
    <button onclick="closeModals()" style="width: 100%; padding: 10px; font-size: 14px; border: none; border-radius: 8px; background: #f0f0f0; color: #555; cursor: pointer; font-weight: 600;">ዝጋ (Close)</button>
  </div>
  
  <div class="modal" id="save-modal">
    <h3>Save Account</h3>
    <div class="form-group">
      <input type="text" id="acc-name" placeholder="Account Name">
      <input type="text" id="acc-number" placeholder="Account Number">
      <button class="save-btn" onclick="saveAccount()">Save Account</button>
    </div>
  </div>
  
  <div class="modal" id="list-modal">
    <h3>Saved Accounts</h3>
    <div id="saved-accounts-list"></div>
  </div>
  
  <div class="modal" id="edit-modal">
    <h3>Edit Account</h3>
    <div class="form-group">
      <input type="text" id="edit-acc-name" placeholder="Account Name">
      <input type="text" id="edit-acc-number" placeholder="Account Number">
      <input type="hidden" id="edit-acc-index">
      <button class="save-btn" onclick="updateAccount()">Update Account</button>
    </div>
  </div>

  <!-- Admin Balance Edit Modal -->
  <div class="modal" id="admin-balance-modal">
    <h3>Set Account Balance</h3>
    <div class="form-group">
      <input type="number" id="admin-balance-input" placeholder="Available Balance (ETB)">
      <button class="save-btn" onclick="saveBalance()">Save / Update</button>
      <button class="save-btn" onclick="closeModals()" style="background: #ccc;">Cancel</button>
    </div>
  </div>
  
  <!-- Floating Map Button (Purple) -->
  <div id="map-button" style="position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: purple; border-radius: 50%; z-index: 1000; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; user-select: none; -webkit-user-select: none; touch-action: manipulation;">Map</div>

  <!-- Storage Scripts with Safe Fallback -->
  <script src="storage.js"></script>
  <script src="src/storage.js"></script>
  <script>
    // Safe storage access fallback in case external script fails in WebView/WebIntoApp
    window._cbeMemoryStore = window._cbeMemoryStore || {};
    window.safeStorage = window.safeStorage || {
      getItem: (key) => {
        try {
          return localStorage.getItem(key);
        } catch (e) {
          return window._cbeMemoryStore[key] || null;
        }
      },
      setItem: (key, val) => {
        try {
          localStorage.setItem(key, val);
        } catch (e) {
          window._cbeMemoryStore[key] = String(val);
        }
      },
      removeItem: (key) => {
        try {
          localStorage.removeItem(key);
        } catch (e) {
          delete window._cbeMemoryStore[key];
        }
      }
    };
    var safeStorage = window.safeStorage;

    window.CbeStorage = window.CbeStorage || {
      getTransactions: () => {
        try {
          return JSON.parse(window.safeStorage.getItem('cbe_transactions') || '[]');
        } catch(e) { return []; }
      },
      saveTransaction: (transaction) => {
        try {
          const txns = window.CbeStorage.getTransactions();
          txns.push(transaction);
          window.safeStorage.setItem('cbe_transactions', JSON.stringify(txns));
        } catch(e) {}
      },
      getBalance: () => {
        try {
          return parseFloat(window.safeStorage.getItem('accountBalance') || '1000.00');
        } catch(e) { return 1000.00; }
      },
      updateBalance: (amount) => {
        try {
          const balance = window.CbeStorage.getBalance();
          window.safeStorage.setItem('accountBalance', (balance - amount).toFixed(2));
        } catch(e) {}
      },
      setExactBalance: (newVal) => {
        try {
          const formatted = parseFloat(String(newVal).replace(/,/g, '')).toFixed(2);
          window.safeStorage.setItem('accountBalance', formatted);
          window.safeStorage.setItem('user_balance', formatted);
          window.safeStorage.setItem('userBalance', formatted);
          return formatted;
        } catch(e) { return '9000.00'; }
      },
      getSavedAccounts: () => {
        try {
          return JSON.parse(window.safeStorage.getItem('savedAccounts') || '[]');
        } catch(e) { return []; }
      },
      saveAccount: (name, number) => {
        try {
          const accounts = window.CbeStorage.getSavedAccounts();
          accounts.push({ name, number });
          window.safeStorage.setItem('savedAccounts', JSON.stringify(accounts));
        } catch(e) {}
      }
    };

    let currentLang = safeStorage.getItem('lang') || 'EN';
    
    function updateImages() {
      const img = document.getElementById('others-content-img');
      if (img) {
        img.src = currentLang === 'AM' ? './btn_others_am.png' : './btn_others_en.png';
      }
    }
    
    function toggleLanguage() {
      currentLang = currentLang === 'AM' ? 'EN' : 'AM';
      safeStorage.setItem('lang', currentLang);
      updateImages();
    }
    
    function goHome() {
        safeStorage.setItem('showHome', 'true');
        window.location.href = 'index.html';
    }

    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
    
    function showModal(id) {
      const overlay = document.getElementById('modal-overlay');
      const target = document.getElementById(id);
      if (overlay) overlay.classList.add('active');
      if (target) target.classList.add('active');
      if (id === 'list-modal') renderAccounts();
      if (id === 'admin-balance-modal') {
        const input = document.getElementById('admin-balance-input');
        if (input) {
          const curr = window.CbeStorage ? window.CbeStorage.getBalance() : (safeStorage.getItem('accountBalance') || '9000.00');
          input.value = curr;
        }
      }
    }
    
    function closeModals() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.classList.remove('active');
      document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
    }

    function saveBalance() {
        const balEl = document.getElementById('admin-balance-input');
        const balance = balEl ? balEl.value : undefined;
        if (balance !== undefined && balance !== '') {
          const formatted = parseFloat(String(balance).replace(/,/g, '')).toFixed(2);
          if (window.CbeStorage && typeof window.CbeStorage.setExactBalance === 'function') {
            window.CbeStorage.setExactBalance(formatted);
          } else {
            safeStorage.setItem('accountBalance', formatted);
            safeStorage.setItem('user_balance', formatted);
            safeStorage.setItem('userBalance', formatted);
          }
          try {
            if (window.AndroidBridge && typeof window.AndroidBridge.postBalanceUpdate === 'function') {
              window.AndroidBridge.postBalanceUpdate(formatted);
            }
          } catch(e) {}
          showToast('የሒሳብ መጠን ተቀይሯል፡ ' + formatted + ' ETB');
        }
        closeModals();
    }

    function saveAccount() {
        const nameInput = document.getElementById('acc-name');
        const numInput = document.getElementById('acc-number');
        const name = nameInput && nameInput.value ? nameInput.value.trim() : '';
        const number = numInput && numInput.value ? numInput.value.trim() : '';
        if (!name || !number) {
            showToast('እባክዎ ሁለቱንም ስም እና ቁጥር ያስገቡ');
            return;
        }
        
        try {
          if (window.CbeStorage && typeof window.CbeStorage.saveAccount === 'function') {
            window.CbeStorage.saveAccount(name, number);
          }
          safeStorage.setItem('cbe_saved_acc_num', number);
          safeStorage.setItem('cbe_saved_acc_name', name);
          
          if (nameInput) nameInput.value = '';
          if (numInput) numInput.value = '';
          
          closeModals();
          showToast('አካውንት ተመዝግቧል፡ ' + name + ' (' + number + ')');
        } catch (e) {
          console.error('Error saving account:', e);
          closeModals();
        }
    }
    
    function renderAccounts() {
        const container = document.getElementById('saved-accounts-list');
        if (!container) return;
        const accounts = window.CbeStorage.getSavedAccounts();
        if (accounts.length === 0) {
            container.innerHTML = '<div style="padding: 15px; color: #666; text-align: center;">No saved accounts yet.</div>';
            return;
        }
        container.innerHTML = accounts.map((acc, index) => `
            <div class="acc-item">
                <div><strong>${acc.name}</strong><br><span style="color: #666;">${acc.number}</span></div>
                <div class="acc-actions">
                    <button class="action-btn" type="button" onclick="editAccount(${index})">✏️</button>
                    <button class="action-btn" type="button" onclick="deleteAccount(${index})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function editAccount(index) {
        const accounts = window.CbeStorage.getSavedAccounts();
        const acc = accounts[index];
        if (!acc) return;
        document.getElementById('edit-acc-name').value = acc.name;
        document.getElementById('edit-acc-number').value = acc.number;
        document.getElementById('edit-acc-index').value = index;
        showModal('edit-modal');
    }

    function updateAccount() {
        const idxEl = document.getElementById('edit-acc-index');
        const nameEl = document.getElementById('edit-acc-name');
        const numEl = document.getElementById('edit-acc-number');
        const index = idxEl ? idxEl.value : undefined;
        const name = nameEl && nameEl.value ? nameEl.value.trim() : '';
        const number = numEl && numEl.value ? numEl.value.trim() : '';
        if (!name || !number || index === undefined) return;
        
        try {
          const accounts = window.CbeStorage.getSavedAccounts();
          accounts[index] = { name, number };
          safeStorage.setItem('savedAccounts', JSON.stringify(accounts));
          safeStorage.setItem('cbe_saved_acc_num', number);
          safeStorage.setItem('cbe_saved_acc_name', name);
          renderAccounts();
          closeModals();
        } catch (e) {
          console.error('Error updating account:', e);
        }
    }

    function deleteAccount(index) {
        try {
          const accounts = window.CbeStorage.getSavedAccounts();
          accounts.splice(index, 1);
          safeStorage.setItem('savedAccounts', JSON.stringify(accounts));
          renderAccounts();
        } catch (e) {
          console.error('Error deleting account:', e);
        }
    }

    function addHoldPressListener(element, callback, duration = 450) {
        if (!element) return;
        let timer = null;
        let startX = 0;
        let startY = 0;
        let triggered = false;
        
        const start = (e) => {
            triggered = false;
            if (e.touches && e.touches[0]) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.clientX !== undefined) {
                startX = e.clientX;
                startY = e.clientY;
            }
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => {
                triggered = true;
                callback();
            }, duration);
        };
        
        const cancel = () => {
            if (timer) {
                clearTimeout(timer);
                timer = null;
            }
        };

        const onTouchMove = (e) => {
            if (!timer) return;
            if (e.touches && e.touches[0]) {
                const dx = Math.abs(e.touches[0].clientX - startX);
                const dy = Math.abs(e.touches[0].clientY - startY);
                if (dx > 15 || dy > 15) {
                    cancel();
                }
            }
        };
        
        element.addEventListener('mousedown', start);
        element.addEventListener('touchstart', start, { passive: true });
        
        element.addEventListener('mouseup', cancel);
        element.addEventListener('mouseleave', cancel);
        element.addEventListener('touchend', cancel);
        element.addEventListener('touchmove', onTouchMove, { passive: true });
        element.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Strict long-press only: normal tap/click does NOT trigger the modal!
        element.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
        });
    }

    function showToast(msg) {
        let toast = document.getElementById('cbe-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'cbe-toast';
            toast.style.cssText = 'position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 22px; border-radius: 25px; font-size: 14px; font-weight: bold; z-index: 2000; box-shadow: 0 4px 14px rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap;';
            document.body.appendChild(toast);
        }
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2200);
    }

    function selectUssdMode(mode) {
        try {
          safeStorage.setItem('cbe_ussd_mode', mode);
          localStorage.setItem('cbe_ussd_mode', mode);
        } catch (e) {}
        syncUssdModeButtons();
        closeModals();
        showToast('የ USSD ኮድ ወደ ' + mode + ' ተቀይሯል');
    }

    function syncUssdModeButtons() {
        const mode = safeStorage.getItem('cbe_ussd_mode') || '733';
        const btn733 = document.getElementById('btn-mode-733');
        const btn847 = document.getElementById('btn-mode-847');
        const btn127 = document.getElementById('btn-mode-127');
        const check733 = document.getElementById('check-mode-733');
        const check847 = document.getElementById('check-mode-847');
        const check127 = document.getElementById('check-mode-127');

        const list = [
          { id: '733', btn: btn733, check: check733 },
          { id: '847', btn: btn847, check: check847 },
          { id: '127', btn: btn127, check: check127 }
        ];

        list.forEach(item => {
          if (!item.btn) return;
          if (mode === item.id) {
            item.btn.style.background = '#6b1d7f';
            item.btn.style.color = '#fff';
            if (item.check) item.check.style.display = 'inline-block';
          } else {
            item.btn.style.background = '#fff';
            item.btn.style.color = '#6b1d7f';
            if (item.check) item.check.style.display = 'none';
          }
        });
    }

    const exchOverlay = document.getElementById('exchange-rate-overlay');
    if (exchOverlay) {
        addHoldPressListener(exchOverlay, () => {
            syncUssdModeButtons();
            showModal('ussd-mode-modal');
        });
    }
    addHoldPressListener(document.getElementById('biometrics-overlay'), () => showModal('save-modal'));
    addHoldPressListener(document.getElementById('chatbot-overlay'), () => showModal('list-modal'));
    addHoldPressListener(document.getElementById('map-button'), () => showModal('admin-balance-modal'));
    addHoldPressListener(document.getElementById('sms-overlay'), () => {
        const bodyText = "TN CBE";
        const isAndroid = /Android/i.test(navigator.userAgent);
        const userPhone = (window.safeStorage ? window.safeStorage.getItem('user_phone') : localStorage.getItem('user_phone')) || "0959842829";
        let smsUrl = isAndroid ? `sms:${userPhone}?body=${encodeURIComponent(bodyText)}` : `sms:${userPhone}&body=${encodeURIComponent(bodyText)}`;
        window.open(smsUrl, '_self');
    });
    
    updateImages();
  </script>
</body>
</html>
