<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Accounts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
    .mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: white;
    }
    #home-image {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
    .back-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      font-size: 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #messages-overlay {
      cursor: pointer;
      position: absolute;
      top: 76.5%;
      left: 5.2%;
      width: 18.5%;
      height: 9%;
      z-index: 60;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div class="back-btn" onclick="localStorage.setItem('showHome', 'true'); window.location.href='index.html';">← Back</div>
    <img id="home-image" src="screen_home.png" alt="All Accounts">
    <div id="messages-overlay" onclick="window.location.href='messages_screen.html'" ontouchend="window.location.href='messages_screen.html'"></div>
    <div id="swipe-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;"></div>
  </div>
  <script>
    let touchStartY = 0;
    const swipeOverlay = document.getElementById('swipe-overlay');

    swipeOverlay.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    swipeOverlay.addEventListener('touchend', (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      if (touchStartY - touchEndY > 50) { // Swipe up
        window.location.href = 'apps_screen.html';
      }
    });
  </script>
</body>
</html>
