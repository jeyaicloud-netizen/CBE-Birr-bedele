<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
    .mobile-frame {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: white;
    }
    #messages-image {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
    .back-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      font-size: 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #cbe-birr-overlay {
      cursor: pointer;
      position: absolute;
      top: 8.7%;
      left: 2.5%;
      width: 95%;
      height: 6.8%;
      z-index: 60;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div class="back-btn" onclick="window.location.href='all_accounts.html'">← Back</div>
    <img id="messages-image" src="screen_messages.png" alt="Messages Screen">
    <div id="cbe-birr-overlay" onclick="window.location.href='cbe_birr_chat.html'" ontouchend="window.location.href='cbe_birr_chat.html'"></div>
  </div>
</body>
</html>
